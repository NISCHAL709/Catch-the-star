<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catch the Star</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      touch-action: none;
      overflow: hidden;
    }
    .bar {
      width: 406px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .bar h2 { margin: 0; font-size: 19px; color: #ffd700; }
    .btns { display: flex; gap: 6px; }
    .btns button {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      background: #0f3460;
      color: #fff;
      border: 2px solid #e94560;
      border-radius: 6px;
    }
    .btns button:disabled { opacity: 0.4; }
    .wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      border: 3px solid #e94560;
      border-radius: 10px;
      background: #16213e;
      display: block;
      max-width: 95vw;
      height: auto;
      touch-action: none;
    }
    #lobby {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      text-align: center;
      z-index: 20;
    }
    #lobby h1 { margin: 6px 0; font-size: 26px; color: #ffd700; }
    #lBest {
      font-size: 13px;
      font-weight: bold;
      color: #4ecca3;
      margin-bottom: 14px;
      background: rgba(78, 204, 163, 0.15);
      padding: 4px 12px;
      border-radius: 15px;
    }
    .leg {
      width: 240px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.7;
    }
    .leg div { display: flex; justify-content: space-between; }
    #playBtn, #restartBtn {
      padding: 12px 38px;
      font-size: 18px;
      font-weight: bold;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 25px;
      z-index: 25;
      touch-action: manipulation;
    }
    #restartBtn {
      display: none;
      position: absolute;
      top: 63%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #modal {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      background: #1a1a2e;
      border: 3px solid #e94560;
      border-radius: 12px;
      padding: 16px;
      z-index: 30;
      text-align: center;
    }
    #modal h3 { margin: 0 0 8px; color: #ffd700; }
    #hList {
      list-style: none;
      padding: 0;
      margin: 8px 0 12px;
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
      font-size: 12px;
    }
    #hList li {
      padding: 6px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
    }
    .mBtns { display: flex; gap: 8px; }
    .mBtns button {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="bar">
  <h2>Catch the Star</h2>
  <div class="btns">
    <button id="pauseBtn" disabled onclick="togglePause()">Pause</button>
    <button id="topRestartBtn" disabled onclick="resetGame()">Restart</button>
    <button onclick="openHistory()">History</button>
  </div>
</div>

<div class="wrap">
  <canvas id="c" width="400" height="500"></canvas>

  <div id="lobby">
    <div style="font-size:44px">&#11088;</div>
    <h1>Catch the Star</h1>
    <div id="lBest">Best Score: 0</div>
    <div class="leg">
      <div><span>Gold Star</span><strong style="color:#ffd700">+1 pt</strong></div>
      <div><span>Cyan Star</span><strong style="color:#00f5d4">+3 pts (Fast)</strong></div>
      <div><span>Heart (Max 3)</span><strong style="color:#ff4d6d">+1 Life</strong></div>
    </div>
    <button id="playBtn" onclick="startGame()">PLAY</button>
  </div>

  <button id="restartBtn" onclick="resetGame()">Play Again</button>

  <div id="modal">
    <h3>Match History</h3>
    <div id="mBest" style="color:#4ecca3;font-weight:bold;margin-bottom:6px">Best Score: 0</div>
    <ul id="hList"></ul>
    <div class="mBtns">
      <button style="background:#0f3460" onclick="clearHist()">Clear</button>
      <button style="background:#e94560" onclick="closeHist()">Close</button>
    </div>
  </div>
</div>

<script>
  var c = document.getElementById("c");
  var ctx = c.getContext("2d");
  var lobby = document.getElementById("lobby");
  var restartBtn = document.getElementById("restartBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var topRestartBtn = document.getElementById("topRestartBtn");
  var modal = document.getElementById("modal");
  var hList = document.getElementById("hList");

  var themes = [
    ["#16213e", "#0f172a"],
    ["#1b263b", "#0d1b2a"],
    ["#240046", "#10002b"],
    ["#1b4332", "#081c15"],
    ["#3c096c", "#240046"],
    ["#590d22", "#2b0510"],
    ["#003049", "#001d2d"],
    ["#2b2d42", "#1a1b28"],
    ["#3a0ca3", "#240066"],
    ["#004b23", "#002913"]
  ];

  var lastT = -1;
  var round = 1;

  function setTheme() {
    var i = Math.floor(Math.random() * themes.length);
    if (i === lastT) {
      i = (i + 1) % themes.length;
    }
    lastT = i;
    var pair = themes[i];
    c.style.background = pair;
    document.body.style.background = pair;
  }
  setTheme();

  var spd = {
    base: 220,
    max: 760,
    sGain: 5.5,
    stGain: 12,
    grav: 0.25,
    pBase: 460,
    pMax: 740
  };

  var pad = { x: 160, y: 460, w: 84, h: 14, s: 460, sq: 0 };
  var star = { x: 200, y: 0, r: 11, s: 220, a: 0, t: "normal" };
  var score = 0;
  var lives = 3;
  var maxLives = 3;
  var streak = 0;
  var maxStreak = 0;
  var inLobby = true;
  var over = false;
  var paused = false;
  var rKey = false;
  var lKey = false;
  var notice = 0;
  var shake = 0;
  var lastTs = 0;
  var parts = [];
  var texts = [];
  var bg = [];

  for (var b = 0; b < 30; b++) {
    bg.push({
      x: Math.random() * 400,
      y: Math.random() * 500,
      sz: Math.random() * 1.8 + 0.5,
      sp: Math.random() * 20 + 10,
      al: Math.random() * 0.5 + 0.2
    });
  }

  function calcSpeed(t) {
    var raw = spd.base + score * spd.sGain + streak * spd.stGain;
    if (raw > spd.max) {
      raw = spd.max;
    }
    if (t === "bonus") {
      return raw * 1.22;
    }
    if (t === "heart") {
      return raw * 0.85;
    }
    return raw;
  }

  function spawnStar() {
    star.x = Math.random() * 350 + 25;
    star.y = -20;
    var r = Math.random();
    if (lives < maxLives && r < 0.08) {
      star.t = "heart";
    } else if (r < 0.25) {
      star.t = "bonus";
    } else {
      star.t = "normal";
    }
    star.s = calcSpeed(star.t);
    var ratio = (score * spd.sGain) / (spd.max - spd.base);
    if (ratio > 1) {
      ratio = 1;
    }
    pad.s = spd.pBase + ratio * (spd.pMax - spd.pBase);
  }

  function addParts(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.4;
      var v = Math.random() * 180 + 70;
      parts.push({
        x: x,
        y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 40,
        sz: Math.random() * 3 + 2,
        col: col,
        life: 1
      });
    }
  }

  function addText(x, y, txt, col) {
    texts.push({ x: x, y: y, txt: txt, col: col, life: 1 });
  }

  function togglePause() {
    if (inLobby || over || modal.style.display === "block") {
      return;
    }
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    if (!paused) {
      lastTs = performance.now();
    }
  }

  function getHist() {
    try {
      var raw = localStorage.getItem("catchStarHistory");
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function bestScore() {
    var h = getHist();
    var m = 0;
    for (var i = 0; i < h.length; i++) {
      if (h[i].score > m) {
        m = h[i].score;
      }
    }
    return m;
  }

  function updBest() {
    document.getElementById("lBest").textContent = "Best Score: " + bestScore();
  }

  function saveHist() {
    var h = getHist();
    var d = new Date().toLocaleDateString();
    h.unshift({ score: score, round: round, date: d });
    if (h.length > 15) {
      h.pop();
    }
    try {
      localStorage.setItem("catchStarHistory", JSON.stringify(h));
    } catch (e) {}
    updBest();
  }

  function openHistory() {
    if (!inLobby && !over && !paused) {
      togglePause();
    }
    var h = getHist();
    document.getElementById("mBest").textContent = "Best Score: " + bestScore();
    hList.innerHTML = h.length ? "" : "<li style='justify-content:center;color:#888'>No matches yet</li>";
    for (var i = 0; i < h.length; i++) {
      var x = h[i];
      var li = document.createElement("li");
      li.innerHTML = "<span><b>#" + (i + 1) + "</b> Score: <b style='color:#ffd700'>" + x.score + "</b></span><span>Tier " + x.round + " (" + x.date + ")</span>";
      hList.appendChild(li);
    }
    modal.style.display = "block";
  }

  function closeHist() {
    modal.style.display = "none";
  }

  function clearHist() {
    try {
      localStorage.removeItem("catchStarHistory");
    } catch (e) {}
    openHistory();
    updBest();
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") rKey = true;
if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") lKey = true;
if (e.key === "p" || e.key === "P") togglePause();
});
document.addEventListener("keyup", function(e) {
if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") rKey = false;
if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") lKey = false;
});
function movePad(cx) {
if (inLobby || paused || over) {
return;
}
var rc = c.getBoundingClientRect();
if (!rc.width) {
return;
}
var x = (cx - rc.left) * (c.width / rc.width);
pad.x = Math.max(0, Math.min(c.width - pad.w, x - pad.w / 2));
}
var isDragging = false;
c.addEventListener("pointerdown", function(e) {
isDragging = true;
if (c.setPointerCapture) {
try { c.setPointerCapture(e.pointerId); } catch (err) {}
}
movePad(e.clientX);
});
c.addEventListener("pointermove", function(e) {
if (isDragging || e.pointerType === "mouse") {
movePad(e.clientX);
}
});
c.addEventListener("pointerup", function() {
isDragging = false;
});
c.addEventListener("pointercancel", function() {
isDragging = false;
});
c.addEventListener("touchstart", function(e) {
if (e.touches && e.touches.length > 0) {
movePad(e.touches.item(0).clientX);
}
}, { passive: true });
c.addEventListener("touchmove", function(e) {
e.preventDefault();
if (e.touches && e.touches.length > 0) {
movePad(e.touches.item(0).clientX);
}
}, { passive: false });
function drawStar(x, y, r, col, ang) {
ctx.save();
ctx.translate(x, y);
ctx.rotate(ang);
ctx.beginPath();
var rot = Math.PI * 1.5;
var step = Math.PI / 5;
ctx.moveTo(0, -r);
for (var i = 0; i < 5; i++) {
ctx.lineTo(Math.cos(rot) * r, Math.sin(rot) * r);
rot += step;
ctx.lineTo(Math.cos(rot) * (r * 0.45), Math.sin(rot) * (r * 0.45));
rot += step;
}
ctx.closePath();
ctx.fillStyle = col;
ctx.fill();
ctx.restore();
}
function drawHeart(x, y, sz, col) {
ctx.save();
ctx.translate(x, y - sz * 0.4);
ctx.beginPath();
ctx.moveTo(0, sz * 0.3);
ctx.bezierCurveTo(-sz, -sz * 0.5, -sz * 1.6, sz * 0.6, 0, sz * 1.4);
ctx.bezierCurveTo(sz * 1.6, sz * 0.6, sz, -sz * 0.5, 0, sz * 0.3);
ctx.fillStyle = col;
ctx.fill();
ctx.restore();
}
function update(dt) {
if (inLobby || paused || over) {
return;
}
if (rKey) pad.x += pad.s * dt;
if (lKey) pad.x -= pad.s * dt;
pad.x = Math.max(0, Math.min(c.width - pad.w, pad.x));
if (pad.sq > 0) pad.sq = Math.max(0, pad.sq - dt * 5);
if (notice > 0) notice -= dt;
if (shake > 0) shake = Math.max(0, shake - dt);
var fallRatio = Math.max(0, star.y / 500);
star.y += star.s * (1 + fallRatio * spd.grav) * dt;
star.a += (star.t === "bonus" ? 4.5 : 2.5) * dt;
var hitX = star.x + star.r > pad.x && star.x - star.r < pad.x + pad.w;
var hitY = star.y + star.r >= pad.y && star.y - star.r <= pad.y + pad.h;
if (hitX && hitY) {
pad.sq = 1;
streak++;
if (streak > maxStreak) maxStreak = streak;
if (star.t === "bonus") {
var pb = 3 + Math.floor(streak / 5);
score += pb;
addParts(star.x, star.y, "#00f5d4", 20);
addText(star.x, star.y - 10, "+" + pb + " BONUS!", "#00f5d4");
} else if (star.t === "heart") {
lives = Math.min(maxLives, lives + 1);
score++;
addParts(star.x, star.y, "#ff4d6d", 18);
addText(star.x, star.y - 10, "+1 LIFE!", "#ff4d6d");
} else {
var pn = 1 + Math.floor(streak / 10);
score += pn;
addParts(star.x, star.y, "#ffd700", 14);
addText(star.x, star.y - 10, "+" + pn, "#ffd700");
}
var nr = Math.floor(score / 10) + 1;
if (nr > round) {
round = nr;
setTheme();
notice = 1.5;
}
spawnStar();
} else if (star.y - star.r > 500) {
lives--;
streak = 0;
addParts(star.x, 490, "#e94560", 16);
addText(star.x, 470, "MISS!", "#e94560");
if (lives <= 0) {
lives = 0;
shake = 0;
over = true;
isDragging = false;
pauseBtn.disabled = true;
saveHist();
restartBtn.style.display = "block";
} else {
shake = 0.25;
spawnStar();
}
}
for (var i = parts.length - 1; i >= 0; i--) {
var p = parts[i];
p.x += p.vx * dt;
p.y += p.vy * dt;
p.vy += 300 * dt;
p.life -= dt * 1.8;
if (p.life <= 0) parts.splice(i, 1);
}
for (var j = texts.length - 1; j >= 0; j--) {
var t = texts[j];
t.y -= 45 * dt;
t.life -= dt * 1.2;
if (t.life <= 0) texts.splice(j, 1);
}
}
function draw(dt) {
ctx.save();
if (shake > 0 && !over && !paused) {
ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 24);
}
ctx.clearRect(0, 0, 400, 500);
for (var b = 0; b < bg.length; b++) {
var s = bg[b];
s.y += s.sp * dt;
if (s.y > 500) {
s.y = 0;
s.x = Math.random() * 400;
}
ctx.fillStyle = "rgba(255,255,255," + s.al + ")";
ctx.beginPath();
ctx.arc(s.x, s.y, s.sz, 0, 6.28);
ctx.fill();
}
if (inLobby) {
ctx.restore();
return;
}
if (!over) {
if (star.t === "heart") {
drawHeart(star.x, star.y, star.r, "#ff4d6d");
} else if (star.t === "bonus") {
drawStar(star.x, star.y, star.r + 2, "#00f5d4", star.a);
} else {
drawStar(star.x, star.y, star.r, "#ffd700", star.a);
}
}
var sq = Math.sin(pad.sq * Math.PI) * 5;
var dw = pad.w + sq * 1.6;
var dh = Math.max(8, pad.h - sq * 0.6);
ctx.fillStyle = "#4ecca3";
ctx.fillRect(pad.x - (dw - pad.w) / 2, pad.y + (pad.h - dh), dw, dh);
for (var i = 0; i < parts.length; i++) {
var p = parts[i];
ctx.fillStyle = p.col;
ctx.globalAlpha = Math.max(0, p.life);
ctx.beginPath();
ctx.arc(p.x, p.y, p.sz, 0, 6.28);
ctx.fill();
}
for (var j = 0; j < texts.length; j++) {
var t = texts[j];
ctx.font = "bold 15px sans-serif";
ctx.fillStyle = t.col;
ctx.globalAlpha = Math.max(0, t.life);
ctx.textAlign = "center";
ctx.fillText(t.txt, t.x, t.y);
}
ctx.globalAlpha = 1;
ctx.font = "bold 16px sans-serif";
ctx.fillStyle = "#fff";
ctx.textAlign = "left";
ctx.fillText("Score: " + score, 14, 28);
var tier = Math.floor((calcSpeed("normal") - spd.base) / 55) + 1;
ctx.font = "13px sans-serif";
ctx.fillStyle = "#4ecca3";
ctx.fillText("Tier " + tier + " - Streak: " + streak, 14, 48);
ctx.textAlign = "right";
ctx.font = "bold 16px sans-serif";
ctx.fillStyle = "#ff4d6d";
ctx.fillText("Lives: " + lives + "/" + maxLives, 386, 28);
if (notice > 0) {
ctx.textAlign = "center";
ctx.font = "bold 20px sans-serif";
ctx.fillStyle = "#ffd700";
ctx.fillText("TIER " + round + "! PACE UP!", 200, 110);
}
if (paused && !over) {
ctx.fillStyle = "rgba(0,0,0,0.6)";
ctx.fillRect(0, 0, 400, 500);
ctx.fillStyle = "#ffd700";
ctx.font = "bold 30px sans-serif";
ctx.textAlign = "center";
ctx.fillText("PAUSED", 200, 250);
}
if (over) {
ctx.fillStyle = "rgba(0,0,0,0.72)";
ctx.fillRect(0, 0, 400, 500);
ctx.fillStyle = "#e94560";
ctx.font = "bold 34px sans-serif";
ctx.textAlign = "center";
ctx.fillText("GAME OVER", 200, 205);
ctx.fillStyle = "#fff";
ctx.font = "bold 20px sans-serif";
ctx.fillText("Final Score: " + score, 200, 242);
ctx.fillStyle = "#4ecca3";
ctx.font = "14px sans-serif";
ctx.fillText("Best Streak: " + maxStreak + " - Tier " + round, 200, 268);
}
ctx.restore();
}
function loop(ts) {
if (!lastTs) {
lastTs = ts;
}
var dt = Math.min(0.05, (ts - lastTs) / 1000);
lastTs = ts;
update(dt);
draw(dt);
requestAnimationFrame(loop);
}
function startGame() {
inLobby = false;
lobby.style.display = "none";
resetGame();
}
function resetGame() {
score = 0;
lives = 3;
streak = 0;
maxStreak = 0;
round = 1;
shake = 0;
notice = 0;
over = false;
paused = false;
isDragging = false;
pauseBtn.disabled = false;
topRestartBtn.disabled = false;
pauseBtn.textContent = "Pause";
parts = [];
texts = [];
pad.x = 158;
restartBtn.style.display = "none";
setTheme();
spawnStar();
lastTs = performance.now();
}
updBest();
requestAnimationFrame(loop);
</script>
</body>
</html>
